[project]
name = "pixaas"
version = "0.1.0"
description = "Pixel Art as a Code: a Python SDK for drawing, composing, animating, and rendering pixel art"
readme = "README.md"
authors = [
    { name = "k2sebeom", email = "moses97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixaas"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
