<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixaaS preview</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #172332; color: #e5ece0; }
  body { max-width: 1000px; margin: 32px auto; padding: 0 24px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  #status { color: #9de1ed; }
  .controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin: 20px 0; }
  button, select { font: inherit; padding: 8px 12px; border: 1px solid #819da6; border-radius: 6px; background: #243342; color: inherit; }
  button { cursor: pointer; }
  label { display: flex; align-items: center; gap: 8px; }
  #stage { min-height: 360px; max-height: 65vh; overflow: auto; display: grid; place-items: center; background: #243342; border-radius: 8px; padding: 24px; }
  #image { image-rendering: pixelated; background-color: #c8c8c8;
    background-image: conic-gradient(#8c8c8c 25%, transparent 0 50%, #8c8c8c 0 75%, transparent 0);
    background-size: 16px 16px; }
  #frame { font-variant-numeric: tabular-nums; }
  #error { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; border: 1px solid #f3a083; background: #412c31; color: #ffd5c7; }
</style>
<h1>PixaaS preview</h1>
<p id="status" role="status">Building preview…</p>
<div class="controls">
  <label>Sprite <select id="sprite" aria-label="Sprite"></select></label>
  <label>Animation <select id="tag" aria-label="Animation"></select></label>
  <label>Zoom <select id="zoom" aria-label="Zoom">
    <option value="1">1×</option><option value="2">2×</option><option value="4">4×</option>
    <option value="8" selected>8×</option><option value="12">12×</option><option value="16">16×</option>
  </select></label>
</div>
<div id="stage"><img id="image" alt="Selected sprite frame" hidden></div>
<div class="controls">
  <button id="previous" aria-label="Previous frame">← Previous</button>
  <button id="play">Play</button>
  <button id="next" aria-label="Next frame">Next →</button>
  <span id="frame" aria-live="polite"></span>
</div>
<pre id="error" role="alert" hidden></pre>
<script>
  const $ = id => document.getElementById(id);
  let assets = {}, revision = -1, position = 0, playing = false, timer;
  let desired = new URLSearchParams(location.search).get("sprite");
  function asset() { return assets[$("sprite").value]; }
  function sequence() {
    const current = asset();
    if (!current) return {indices: [], loop: true};
    return current.tags.find(tag => tag.name === $("tag").value) ||
      {indices: current.frames.map((_, i) => i), loop: true};
  }
  function options(element, values, selected) {
    element.replaceChildren(...values.map(([value, label]) => {
      const option = document.createElement("option");
      option.value = value; option.textContent = label; return option;
    }));
    if (values.some(([value]) => value === selected)) element.value = selected;
  }
  function tags() {
    const old = $("tag").value;
    options($("tag"), [["", "All frames"], ...(asset()?.tags || []).map(t => [t.name, t.name])], old);
  }
  function draw() {
    clearTimeout(timer);
    const current = asset(), seq = sequence();
    for (const id of ["previous", "play", "next"]) $(id).disabled = !current;
    if (!current) return;
    position = Math.min(position, seq.indices.length - 1);
    const index = seq.indices[position], frame = current.frames[index];
    $("image").hidden = false; $("image").src = frame.image;
    $("image").width = current.width * Number($("zoom").value);
    $("image").height = current.height * Number($("zoom").value);
    $("frame").textContent = `${index + 1}/${current.frames.length} · ${frame.name} · ${frame.duration_ms} ms`;
    $("play").textContent = playing ? "Pause" : "Play";
    if (playing) timer = setTimeout(() => {
      if (position === seq.indices.length - 1 && !seq.loop) { playing = false; }
      else { position = (position + 1) % seq.indices.length; }
      draw();
    }, frame.duration_ms);
  }
  $("sprite").onchange = () => { desired = $("sprite").value; position = 0; tags(); draw(); };
  $("tag").onchange = () => { position = 0; draw(); };
  $("zoom").onchange = draw;
  $("play").onclick = () => {
    if (!playing && position === sequence().indices.length - 1 && !sequence().loop) position = 0;
    playing = !playing; draw();
  };
  function step(delta) {
    playing = false;
    const length = sequence().indices.length;
    if (length) position = (position + delta + length) % length;
    draw();
  }
  $("previous").onclick = () => step(-1);
  $("next").onclick = () => step(1);
  async function poll() {
    try {
      const response = await fetch("/state", {cache: "no-store"});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const state = await response.json();
      if (state.revision !== revision) {
        revision = state.revision;
        assets = state.assets;
        options($("sprite"), Object.keys(assets).map(name => [name, name]), desired);
        tags(); draw();
        $("error").hidden = !state.error;
        $("error").textContent = state.error || "";
      }
      const missing = desired && !(desired in assets) && Object.keys(assets).length;
      $("status").textContent = state.building ? "Building preview…" :
        state.error ? "Script error — showing the last successful preview." :
        missing ? `Sprite “${desired}” is unavailable. Select an available sprite.` :
        "Watching Python sources · save a file to refresh";
    } catch (error) {
      $("status").textContent = "Preview disconnected — retrying…";
    }
    setTimeout(poll, 400);
  }
  draw(); poll();
</script>
</html>
