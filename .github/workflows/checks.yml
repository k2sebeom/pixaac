name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest -q
      - run: uv build
      - name: Smoke-test installed distribution
        run: uv run --isolated --no-project --python ${{ matrix.python }} --with dist/*.whl python -I scripts/smoke_installed.py
